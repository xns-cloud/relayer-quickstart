# XNS Relayer — Quickstart compose
#
# One container: the Relayer (UI + S3 gateway + storage engine).
# Start:   docker compose up -d
# Stop:    docker compose down
# Update:  docker compose pull && docker compose up -d
# Reset:   docker compose down -v   (deletes all data)
#
# After starting, open http://localhost:8888 to reach the dashboard
# and complete the claim wizard.

services:
  relayer:
    container_name: xns-relayer
    image: releases.scpri.me/xns-relayer:beta-latest
    pull_policy: always
    restart: unless-stopped
    privileged: true
    ports:
      - "${UI_PORT:-8888}:8888"     # Web dashboard
      - "${S3_PORT:-9000}:9000"     # S3 API (HTTP)
      - "${S3_TLS_PORT:-9443}:9443" # S3 API (HTTPS — active after installing a TLS cert)
    environment:
      - NODE_ENV=production
      - XNS_RELEASE_CHANNEL=beta
    volumes:
      - relayer_data:/relayer
      - ${LEGACY_DATA_PATH:-./data}:/relayer-legacy-check:ro

volumes:
  relayer_data:
