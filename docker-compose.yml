# XNS Relayer — Quickstart compose
#
# One container: the Relayer (UI + S3 gateway + storage engine).
# Start:   docker compose up -d
# Stop:    docker compose down
# Update:  docker compose pull && docker compose up -d
# Reset:   docker compose down -v   (deletes all data)
#
# After starting, open http://localhost:8888 to reach the dashboard
# and claim the Relayer.

services:
  relayer:
    container_name: xns-relayer
    # release-latest is the production channel, and it is a moving tag:
    # `docker compose pull` always fetches the newest release build. For a
    # reproducible deployment, replace it with a specific version tag (see the
    # repository's release notes) and set pull_policy to missing.
    image: releases.scpri.me/xns-relayer:release-latest
    pull_policy: always
    restart: unless-stopped
    ports:
      # These publish on ALL host interfaces. On a machine reachable from the
      # internet, put the ports behind a firewall or bind them to loopback
      # (e.g. "127.0.0.1:8888:8888") until the Relayer has been claimed —
      # before claiming, port 8888 serves the onboarding surface to anyone
      # who can reach it.
      - "${UI_PORT:-8888}:8888"     # Web dashboard
      - "${S3_PORT:-9000}:9000"     # S3 API (HTTP)
      - "${S3_TLS_PORT:-9443}:9443" # S3 API (HTTPS — active after installing a TLS cert)
    environment:
      - NODE_ENV=production
      - XNS_RELEASE_CHANNEL=release
    volumes:
      - relayer_data:/relayer

volumes:
  relayer_data:
